name: 'igrpplatformprocessmanagerstudio-api-service'

networks:
  default:
    name: igrpplatformprocessmanagerstudio
    external: false

services:

  postgres-igrpplatformprocessmanagerstudio-api-service:
      image: postgres:17-alpine
      container_name: postgres-igrpplatformprocessmanagerstudio-api-service
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DATABASE}
      ports:
        - ${POSTGRES_EXTERNAL_PORT}:${POSTGRES_INTERNAL_PORT}
      volumes:
        - postgres-data-17-igrpplatformprocessmanagerstudio-api-service:/var/lib/postgresql/data
      restart: unless-stopped

  igrpplatformprocessmanagerstudio-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igrpplatformprocessmanagerstudio-service
    env_file:
      - .env
    depends_on:
      - postgres-igrpplatformprocessmanagerstudio-api-service
    environment:
      - SERVER_PORT=${SERVICE_PORT}
      - SERVICE_NAME=igrpplatformprocessmanagerstudio-service
      - SPRING_ACTIVE_PROFILE=${SERVICE_PROFILE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:${POSTGRES_INTERNAL_PORT}/${POSTGRES_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER}
    ports:
      - ${SERVICE_PORT}:${SERVICE_PORT}
    #restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

volumes:
  postgres-data-17-igrpplatformprocessmanagerstudio-api-service:
    driver: local
