# General
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false

spring.application.name=${SERVICE_NAME:igrp-platform-process-management-studio}
# Default profile
# Production-safe default: development (ddl-auto=update, show-sql) must be an explicit choice
spring.profiles.active=${SPRING_ACTIVE_PROFILE:production}

server.shutdown=graceful

# Authorization adapter. Possible values: default|irn
igrp.authorization.service.adapter=${IGRP_AUTHORIZATION_SERVICE_ADAPTER:default}
# Dev escape for the provider-less default adapter: when set, a JWT whose email claim matches is
# super admin (mirrors the IRN adapter's IRN_API_SUPER_ADMIN_EMAIL). Empty = nobody, as before.
igrp.authorization.default.super-admin-email=${IGRP_DEFAULT_SUPER_ADMIN_EMAIL:}

# JWT claim used as the principal name, and therefore as the audit author
igrp.security.principal-claim-name=${IGRP_SECURITY_PRINCIPAL_CLAIM_NAME:sub}

# Comma-separated browser origins for CORS; empty disables cross-origin access entirely
igrp.cors.allowed-origins=${IGRP_CORS_ALLOWED_ORIGINS:}

# RS256-signed RestClient used to call the IRN API
igrp.restclient.provider=${IGRP_RESTCLIENT_PROVIDER:}
igrp.authorization.jwt.key=${IGRP_AUTHORIZATION_JWT_KEY:default}
igrp.authorization.jwt.private-key=${IGRP_AUTHORIZATION_JWT_PRIVATE_KEY:default}

# IRN identity provider (read by process-runtime-auth-irn when the adapter above is 'irn')
irn.api.base-url=${IRN_API_BASE_URL:}
irn.api.super-admin-email=${IRN_API_SUPER_ADMIN_EMAIL:}
irn.api.session-cookie-name=${IRN_API_SESSION_COOKIE_NAME:session_id}

# Caches the /Auth/me lookup, so a request resolves the caller once instead of three times
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=5m

# Route authorization. Permissions are MODULE:action and are derived from the HTTP method
# (GET=visualizar, POST=criar, PUT/PATCH=editar, DELETE=eliminar); overrides cover the routes that
# escape that rule. Catalogue and rationale: docs/SPEC_ROUTE_AUTHORIZATION.md
irn.authorization.routes.deny-unmatched=${IRN_AUTHORIZATION_DENY_UNMATCHED:true}

# M2M API keys (SPEC_M2M_AUTHORIZATION.md, management API repo). The pepper keys the HMAC of stored
# key hashes — production MUST set it. Rotate grace = how long the old key stays valid after rotate.
igrp.authorization.m2m.pepper=${IGRP_M2M_KEY_PEPPER:}
igrp.authorization.m2m.rotate-grace=${IGRP_M2M_ROTATE_GRACE:7d}

# Existing databases predate Flyway here: baseline them at version 1 so the M2M migration (V2) runs
# without tripping over a non-empty schema.
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# Order matters: /api/v1/projects is a prefix of the two process-definition patterns and would
# swallow them if it came first.
irn.authorization.routes.modules[0].code=STUDIO_PROCESS_DEFINITIONS
irn.authorization.routes.modules[0].pattern=/api/v1/projects/process-definitions
# Deploying publishes executable BPMN to the process engine: its own action, not shared with :criar
irn.authorization.routes.modules[0].overrides[0].method=POST
irn.authorization.routes.modules[0].overrides[0].path=/*/deploy
irn.authorization.routes.modules[0].overrides[0].action=publicar
# accept-also: if an IRN frontend (candidate: PROCESS_CONFIGURATION, CONFIGURADOR_PROCESSOS) also fronts
# the Studio design-time routes, list its codes per tier and uncomment. Any-of, alongside the derived
# STUDIO_PROCESS_DEFINITIONS:<action>. Fill from System Administration (no rebuild). Same code lives on
# modules[1] (POST create path) — mirror there if the frontend hits it too.
#irn.authorization.routes.modules[0].accept-also.visualizar=${IRN_STUDIO_PD_ACCEPT_READ:}
#irn.authorization.routes.modules[0].accept-also.criar=${IRN_STUDIO_PD_ACCEPT_WRITE:}
#irn.authorization.routes.modules[0].accept-also.editar=${IRN_STUDIO_PD_ACCEPT_EDIT:}
#irn.authorization.routes.modules[0].accept-also.publicar=${IRN_STUDIO_PD_ACCEPT_PUBLISH:}

irn.authorization.routes.modules[1].code=STUDIO_PROCESS_DEFINITIONS
irn.authorization.routes.modules[1].pattern=/api/v1/projects/*/process-definitions
#irn.authorization.routes.modules[1].accept-also.criar=${IRN_STUDIO_PD_ACCEPT_WRITE:}

irn.authorization.routes.modules[2].code=STUDIO_PROJECTS
irn.authorization.routes.modules[2].pattern=/api/v1/projects
# accept-also candidates for the projects list/CRUD, if fronted by an IRN module.
#irn.authorization.routes.modules[2].accept-also.visualizar=${IRN_STUDIO_PROJ_ACCEPT_READ:}
#irn.authorization.routes.modules[2].accept-also.criar=${IRN_STUDIO_PROJ_ACCEPT_WRITE:}
#irn.authorization.routes.modules[2].accept-also.editar=${IRN_STUDIO_PROJ_ACCEPT_EDIT:}

irn.authorization.routes.modules[3].code=STUDIO_PARAMETERIZATION
irn.authorization.routes.modules[3].pattern=/parameterization
# accept-also: only a read tier exists on /parameterization.
#irn.authorization.routes.modules[3].accept-also.visualizar=${IRN_STUDIO_PARAM_ACCEPT_READ:}

# Observability
otel.resource.attributes.service.name=${spring.application.name}
otel.resource.attributes.deployment.environment=${spring.profiles.active}
otel.logs.exporter=otlp
otel.metrics.exporter=otlp
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${OTEL_COLLECTOR_ENDPOINT}
otel.sdk.disabled=${OTEL_DISABLED:true}
# Ship SLF4J key-value pairs (security audit events) and MDC entries as OTLP log attributes
otel.instrumentation.logback-appender.experimental.capture-key-value-pair-attributes=true
otel.instrumentation.logback-appender.experimental.capture-mdc-attributes=*
otel.instrumentation.logback-appender.experimental-log-attributes=true
